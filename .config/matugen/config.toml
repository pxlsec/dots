[config]
# version_check = true

[config.wallpaper]
command = "true" # Prevent from setting wallpaper
# arguments = ["img", "--transition-type", "center"]

[config.custom_colors]
black = { color = "#000000", blend = true }
grey = { color = "#666666", blend = true }
red = { color = "#ff0000", blend = true }
maroon = { color = "#800000", blend = true }
green = { color = "#00ff00", blend = true }
lime = { color = "#008000", blend = true }
yellow = { color = "#ffff00", blend = true }
olive = { color = "#808000", blend = true }
blue = { color = "#0000FF", blend = true }
navy = { color = "#000080", blend = true }
fuchsia = { color = "#ff00ff", blend = true }
purple = { color = "#800080", blend = true }
aqua = { color = "#00ffff", blend = true }
teal = { color = "#008080", blend = true }
white = { color = "#ffffff", blend = true }
smoke = { color = "#888888", blend = true }

[config.custom_keywords]
font = "FiraCode Nerd Font"

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'

[templates.wofi]
input_path = './templates/colors.css'
output_path = '~/.config/wofi/colors.css'

[templates.hyprland]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'

[templates.ghostty]
input_path = './templates/ghostty-theme.conf'
output_path = '~/.config/ghostty/themes/colors'

#[templates.starship]
#input_path = 'path/to/template'
#output_path = '~/.config/starship.toml'

[templates.pywalfox]
input_path = './templates/pywalfox.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.gtk3]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.qt5ct]
input_path = './templates/qtct.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'
