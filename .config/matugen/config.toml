[config]
# version_check = true

[config.wallpaper]
command = "swww"
arguments = ["img", "--transition-type", "simple", "--transition-duration", "2"]
set = true

[config.custom_colors]
black = { color = "#000000", blend = true }
grey = { color = "#666666", blend = true }
red = { color = "#ff0000", blend = true }
maroon = { color = "#800000", blend = true }
green = { color = "#00ff00", blend = true }
lime = { color = "#008000", blend = true }
yellow = { color = "#ffff00", blend = true }
olive = { color = "#808000", blend = true }
blue = { color = "#0000FF", blend = true }
navy = { color = "#000080", blend = true }
fuchsia = { color = "#ff00ff", blend = true }
purple = { color = "#800080", blend = true }
aqua = { color = "#00ffff", blend = true }
teal = { color = "#008080", blend = true }
white = { color = "#ffffff", blend = true }
smoke = { color = "#888888", blend = true }

[config.custom_keywords]
font = "FiraCode Nerd Font"

[templates.hyprland]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'


[templates.dunst]
input_path = './templates/dunst.conf'
output_path = '~/.config/dunst/dunstrc.d/10-colors.conf'
