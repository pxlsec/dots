# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

bind = $mainMod, Space, exec, pkill rofi || rofi -show drun
bind = $mainMod, Return, exec, $TERM
bindl = $mainMod, Tab, exec, hyprctl switchxkblayout current next
bind = $mainMod, B ,exec, $BROWSER
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, nemo
bind = $mainMod, V, togglefloating, 
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, Y, togglesplit, # dwindle
bind = $mainMod, P, pin
bind = $mainMod, U, exec, pidof hyprlock || hyprlock
bindl = $mainMod, U, exec, sleep 1 && hyprctl dispatch dpms off
bind = $mainMod $shiftMod, U, exec, systemctl suspend
#bind = $mainMod, Q, exec, perf record -a -g sleep 1


bind = $mainMod, S, exec, hyprshot -o ~/Pictures/Screenshots -c -m active -m output # Screenshot a monitor
bind = $mainMod $controlMod, S, exec, hyprshot -o ~/Pictures/Screenshots -c -m active -m window # Screenshot a window
bind = $mainMod $shiftMod, S, exec, hyprshot -z -o ~/Pictures/Screenshots -m region # Screenshot a region
bind = $mainMod, F1, exec, hyprpicker -a -f hex # Color Picker

# OBS
bind = $mainMod, F9, pass, ^(com.obsproject.Studio)$  # Save replay

# Media Controls
bindle = $mainMod, F2, exec, wpctl set-volume -l 1.5 @DEFAULT_SINK@ 3%- # Volume down
bindle = $mainMod, F3, exec, wpctl set-volume -l 1.5 @DEFAULT_SINK@ 3%+ # Volume up

bindl = $mainMod, F5, exec, playerctl -p "spotify" play-pause        # Toggle Play
bindl = $mainMod, F6, exec, playerctl -p "spotify" shuffle "Toggle"  # Toggle Shuffle
bindl = $mainMod, F7, exec, playerctl -p "spotify" previous          # Previous Track
bindl = $mainMod, F8, exec, playerctl -p "spotify" next              # Next Track

# Discord
bind = SUPER, M, sendshortcut, SUPER, F10, class:^(discord)$    # Mute Discord
bind = SUPER SHIFT, M, sendshortcut, SUPER, F11, class:^(discord)$   # Deafen Discord
# bindo = SUPER, M, sendshortcut, SUPER, F11, class:^(discord)$   # Deafen Discord

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, ~/.config/hypr/dispatcher.sh 1
bind = $mainMod, 2, exec, ~/.config/hypr/dispatcher.sh 2
bind = $mainMod, 3, exec, ~/.config/hypr/dispatcher.sh 3
bind = $mainMod, 4, exec, ~/.config/hypr/dispatcher.sh 4
bind = $mainMod, 5, exec, ~/.config/hypr/dispatcher.sh 5
bind = $mainMod, 6, exec, ~/.config/hypr/dispatcher.sh 6
bind = $mainMod, 7, exec, ~/.config/hypr/dispatcher.sh 7
bind = $mainMod, 8, exec, ~/.config/hypr/dispatcher.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/dispatcher.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/dispatcher.sh 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
